<!doctype html>
<!-- Template for the section and product pages (see scripts/catalog.mjs).
     The build fills in the head and body for each page, then removes this file. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ece4" />
    <!--page:head-->
    <script>
      document.documentElement.classList.add('js')
      try {
        if (localStorage.getItem('motion') === 'reduced') document.documentElement.classList.add('reduced-motion')
      } catch (e) {}
    </script>
    <script type="module" src="/src/catalog/main.js"></script>
  </head>
  <body class="catalog">
    <!--page:body-->
  </body>
</html>
